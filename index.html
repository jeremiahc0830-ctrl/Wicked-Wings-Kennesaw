<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wicked Wings Kennesaw - Full Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --primary-orange: #FF5722;
            --accent-red: #D32F2F;
            --text-light: #F5F5F5;
            --text-muted: #AAAAAA;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Inter', sans-serif; line-height: 1.6; }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(18, 18, 18, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #222;
        }
        .logo { font-family: 'Oswald', sans-serif; font-size: 26px; color: var(--primary-orange); letter-spacing: 1px; }
        nav a { color: var(--text-light); text-decoration: none; margin-left: 25px; font-weight: 700; font-size: 14px; text-transform: uppercase; transition: color 0.3s; }
        nav a:hover { color: var(--primary-orange); }

        /* Hero Banner */
        .hero {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            margin-top: 60px;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
        }
        .hero h1 { font-family: 'Oswald', sans-serif; font-size: 3.5rem; color: #FFFFFF; text-transform: uppercase; letter-spacing: 2px; }
        .hero h1 span { color: var(--primary-orange); }

        /* Menu Section & Interactive Tabs */
        .menu-section { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .tab-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background-color: var(--bg-card);
            color: var(--text-light);
            border: 1px solid #333;
            padding: 10px 20px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .tab-btn:hover, .tab-btn.active {
            background-color: var(--primary-orange);
            color: #fff;
            border-color: var(--primary-orange);
        }

        .menu-category { display: none; }
        .menu-category.active { display: block; }

        .category-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            color: var(--primary-orange);
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .menu-item {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .item-name { font-family: 'Oswald', sans-serif; font-size: 1.25rem; color: #fff; }
        .item-price { font-family: 'Oswald', sans-serif; font-size: 1.15rem; color: var(--primary-orange); }
        .item-desc { color: var(--text-muted); font-size: 0.9rem; }

        /* Footer */
        footer { background-color: #0a0a0a; padding: 40px 20px; text-align: center; border-top: 2px solid #222; margin-top: 60px; }
        footer p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Wicked Wings</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="#menu">Full Menu</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Explore Our <span>Full Menu</span></h1>
    </section>

    <div class="menu-section" id="menu">
        <!-- Tab Buttons -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="openTab(event, 'appetizers')">Chips & Dips / Apps</button>
            <button class="tab-btn" onclick="openTab(event, 'handhelds')">Handhelds & Burgers</button>
            <button class="tab-btn" onclick="openTab(event, 'wings')">Wings</button>
            <button class="tab-btn" onclick="openTab(event, 'pizzas')">From The Oven</button>
            <button class="tab-btn" onclick="openTab(event, 'salads')">Salads & Soups</button>
            <button class="tab-btn" onclick="openTab(event, 'sides')">Sides</button>
            <button class="tab-btn" onclick="openTab(event, 'desserts')">Desserts</button>
            <button class="tab-btn" onclick="openTab(event, 'beerwine')">Beer & Wine</button>
            <button class="tab-btn" onclick="openTab(event, 'cocktails')">Cocktails & Shots</button>
        </div>

        <!-- 1. Appetizers -->
        <div id="appetizers" class="menu-category active">
            <h2 class="category-title">Chips & Dips / Appetizers</h2>
            <div class="menu-grid">
                <div class="menu-item"><div class="item-header"><span class="item-name">Chips & Dips</span>
